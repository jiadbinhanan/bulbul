name: Windows dev build

# Builds fresh Windows NSIS installer on push to main or manual trigger.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Configure updater artifacts for fork builds
        id: prep
        shell: pwsh
        run: |
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY found; disabling updater artifacts so Windows installer builds cleanly without signing..."
            $confPath = "src-tauri/tauri.conf.json"
            $json = Get-Content $confPath -Raw | ConvertFrom-Json
            $json.bundle.createUpdaterArtifacts = $false
            $json | ConvertTo-Json -Depth 10 | Set-Content $confPath
            echo "include_updater=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "include_updater=true" >> $env:GITHUB_OUTPUT
          }

      - name: Wipe previous dev release
        # Delete existing release tag so fresh build replaces it cleanly
        run: gh release delete windows-dev --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: windows-dev
          releaseName: 'Bulbul Windows Build'
          releaseBody: |
            Automated Windows build of Bulbul with Google Gemini 3.5 Transcribe support for Bengali and Banglish Coding dictation.
            
            Download and run the `.exe` NSIS installer below.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: ${{ steps.prep.outputs.include_updater == 'true' }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bulbul-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn
